services:
  db4all:
    build: .
    image: db4all2:latest
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: "jdbc:h2:file:/data/db4all;DB_CLOSE_DELAY=-1"
    volumes:
      # Application database (H2), persisted across restarts.
      - db4all-data:/data
      # Repo samples (CSV, JSON, Excel), mounted read-only so datasources
      # can point at /sample.
      - ./sample:/sample:ro
    restart: unless-stopped

volumes:
  db4all-data:
